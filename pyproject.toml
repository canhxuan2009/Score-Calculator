[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "point-audit"
version = "0.1.0"
description = "Khung ứng dụng kiểm tra và đối soát điểm thi đua từ Excel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Score Calculator contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "python-dateutil>=2.9,<3",
    "RapidFuzz>=3.9,<4",
    "SQLAlchemy>=2.0,<3",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
ai = ["openai>=1.40,<3"]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[project.scripts]
point-audit = "point_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/point_audit", "app.py"]

